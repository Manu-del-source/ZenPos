services:
  - type: web
    name: zenpos-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements/base.txt && python manage.py collectstatic --no-input && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_CONN_MAX_AGE
        value: "0"
      - key: POSTGRES_SSL_REQUIRE
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: zenpos-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
