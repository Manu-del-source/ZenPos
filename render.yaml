services:
  - type: web
    name: zenpos-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements/base.txt && python manage.py collectstatic --no-input && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_CONN_MAX_AGE
        value: "0"
      - key: POSTGRES_SSL_REQUIRE
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: zenpos-ef02.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # M-Pesa (Safaricom Daraja): environment-only by design (ADR-0005).
      # Values are entered in the Render dashboard, never in the repository.
      - key: MPESA_ENV
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_CALLBACK_SECRET
        sync: false
